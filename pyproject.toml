[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-pulse-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for DuckDB data quality profiling and governed analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_pulse_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]